# Settings
- defaults:
    link:
      create: true  # create empty folder if neccessary
      relink: true  # remove old target if it's symlink
      force: true   # force remove old target

# Clean dead symlinks
- clean: ["~", "~/.config"]

# Run shell commands
- shell:
    # Update submodules
    - [git submodule update --init --recursive, Installing submodules]

# Symlink files
- link:
    # Bash
    ~/.bashrc: shells/bashrc
    ~/.config/user-dirs.dirs: configs/user-dirs.dirs
    ~/.config/user-dirs.config: configs/user-dirs.conf

    # ripgrep
    ~/.config/ripgreprc: configs/ripgreprc
    # Git
    ~/.gitconfig: git/gitconfig
    # ~/.gitignore: git/gitignore
    # ~/.gitattributes: git/gitattributes

    # Git template
    #~/.git_template: git_template

    # Vim
    ~/.vim/vimrc: vim/vimrc
    ~/.vim/coc-settings.json: vim/coc-settings.json
    ~/.config/coc/extensions/package.json: vim/coc-package.json
    ~/.config/nvim: nvim/stable
    # Tmux
    ~/.config/tmux: tmux

    # Sublime text
    ~/.config/sublime-text/Packages/User/Preferences.sublime-settings: configs/subl/subl_settings.json
    ~/.config/sublime-text/Packages/User/Default (Linux).sublime-keymap: configs/subl/subl_keybinding.json
    # Zed editor
    ~/.config/zed/settings.json: configs/zed/settings.json
    # fcitx5
    ~/.config/fcitx5/profile: configs/fcitx5/profile
    ~/.config/fcitx5/config: configs/fcitx5/config
    # onedrive
    ~/.config/onedrive/config: configs/onedrive/config
    ~/.config/onedrive/sync_list: configs/onedrive/sync_list
